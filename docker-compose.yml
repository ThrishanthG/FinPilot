version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sfa-postgres
    restart: always
    environment:
      POSTGRES_DB: smart_finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sfa-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ml-service:
    build: ./ml-service
    container_name: sfa-ml-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - redis

  backend:
    build: ./backend
    container_name: sfa-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/smart_finance?schema=public
      - DIRECT_URL=postgresql://postgres:password123@postgres:5432/smart_finance?schema=public
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_ACCESS_SECRET=super_secret_access_key_123!
      - JWT_REFRESH_SECRET=super_secret_refresh_key_456!
      - ANTHROPIC_API_KEY=mock_key
      - PORT=3001
    depends_on:
      - postgres
      - redis
      - ml-service

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
        NEXT_PUBLIC_WS_URL: http://localhost:3001
    container_name: sfa-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
